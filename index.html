.sheet.sos{text-align:center;max-height:92vh;overflow-y:auto}
.sheet.sos h2{margin-top:0}
.breath{position:relative;width:150px;height:150px;margin:14px auto 8px;display:grid;place-items:center}
.breath i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(91,75,255,.55),rgba(53,224,161,.25));animation:breathe 12s ease-in-out infinite}
.breath span{position:relative;font:700 16px var(--fd);color:var(--text)}
@keyframes breathe{0%{transform:scale(.62)}33%{transform:scale(1)}50%{transform:scale(1)}100%{transform:scale(.62)}}
.urge-t{font-size:15px;margin-bottom:12px}
.urge-t b{font-family:var(--fd);font-size:20px;color:var(--brand)}
.ideas{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.ideas li{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:14px}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (prefers-reduced-motion:reduce){.breath i{animation:none;transform:scale(.85)}}
.sv-big b span{font:inherit;color:inherit}
.sv-home .rm b{color:var(--good);font-family:var(--fd)}

.hidefab .fab,.hidefab .companion{display:none!important}
.svcard.flash{animation:flashc 1.6s ease-out}
@keyframes flashc{0%{box-shadow:0 0 0 0 rgba(53,224,161,.8)}40%{box-shadow:0 0 0 10px rgba(53,224,161,.25)}100%{box-shadow:var(--shadow)}}

/* ---------- assistant de sevrage ---------- */
.svw{padding-top:14px}
.svw-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.svw-h{font-size:21px;line-height:1.25}
.svw-nav{display:flex;gap:10px;margin-top:20px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:14px;border:0;background:var(--surface2);color:var(--text);font:700 24px var(--fb);cursor:pointer;flex:none}
.stepper button:active{transform:scale(.94)}
.stepper input{text-align:center;font:800 24px var(--fd);padding:10px}
.stepper.sm{gap:6px}
.stepper.sm button{width:38px;height:38px;font-size:20px;border-radius:12px}
.stepper.sm b{min-width:46px;text-align:center;font:800 20px var(--fd)}
.stepper.sm b.over{color:var(--bad)}
.opt b{display:block;font-family:var(--fd);font-size:15px}
.plan-sum{margin-top:6px}
.wk-plan{display:flex;gap:6px;flex-wrap:wrap}
.wk-plan span{background:var(--surface2);border-radius:12px;padding:6px 10px;text-align:center;min-width:46px}
.wk-plan small{display:block;font-size:10.5px;color:var(--muted)}
.wk-plan b{font-family:var(--fd);font-size:15px}
.sv-goal{margin-top:10px;font-size:14px;font-weight:600;background:var(--brand-soft);border-radius:12px;padding:8px 12px}
.sv-why{margin-top:12px;padding:10px 12px;border-left:4px solid var(--brand);background:var(--surface2);border-radius:0 12px 12px 0;font-style:italic;font-size:14px}
.sv-why span{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.sv-plan{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sv-plan>b{font-size:13px}
.sv-plan div{background:var(--surface2);border-radius:12px;padding:8px 10px}
.sv-plan div span{font-weight:700;color:var(--brand);margin-right:4px}
.rdz{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;background:var(--surface2);border-radius:16px;padding:10px 12px}
.rd-l b{display:block;font-size:14px}
.rd-l span{font-size:12px;color:var(--muted)}
/* ---------- Sommeil ---------- */
.sl-hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(160deg,#141B4D 0%,#2A2478 55%,#5B3FA8 100%);box-shadow:0 20px 40px -16px rgba(40,30,140,.7)}
.sl-hero .btn{background:#fff;color:#2A2478;box-shadow:none}
.sl-hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.sl-st{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 120px 70px,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 220px 20px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 300px 90px,rgba(255,255,255,.5),transparent);background-size:340px 130px;animation:twk 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes twk{from{opacity:.55}to{opacity:1}}
.sl-hero>*:not(.sl-st){position:relative}
.sl-h1{font-size:13px;font-weight:700;opacity:.85}
.sl-big{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1.1;margin:4px 0}
.sl-sub{opacity:.85;font-size:14px}
.sl-score{display:inline-flex;align-items:center;gap:10px;margin-top:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 14px 6px 8px}
.sl-score b{background:#fff;color:#2A2478;border-radius:99px;padding:4px 11px;font-family:var(--fd);font-size:16px}
.sl-score span{font-size:13px;font-weight:600}
.sl-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sl-tiles div{background:var(--surface2);border-radius:14px;padding:10px 4px;text-align:center}
.sl-tiles b{display:block;font-family:var(--fd);font-size:16px}
.sl-tiles span{font-size:11px;color:var(--muted)}
.dial{width:100%;max-width:300px;margin:6px auto 12px;display:block;overflow:visible}
.dial .dl{fill:var(--muted);font:700 10px var(--fb)}
.dial .dd{fill:var(--text);font:800 24px var(--fd)}
.dial .ds{fill:var(--muted);font:600 10px var(--fb)}
.dial .de{font-size:15px}
.dh{cursor:grab;touch-action:none}
.sl-d{width:44px;height:48px;border:0;border-radius:12px;background:var(--surface2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;flex:none;font:inherit;line-height:1.1}
.sl-d span{font-size:10.5px;color:var(--muted);font-weight:600}
.sl-d b{font-family:var(--fd);font-size:16px}
.sl-home.night{background:linear-gradient(160deg,#141B4D,#2A2478);color:#fff;border-color:transparent}
.sl-home.night .btn{background:#fff;color:#2A2478;box-shadow:none}
.sl-home.night .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.sl-mini b{display:block;font-family:var(--fd);font-size:20px}
.sl-mini span{font-size:12px;color:var(--muted)}
.sheet .sl-big{color:var(--text);font-size:44px}
/* mode nuit plein écran */
#night{position:fixed;inset:0;z-index:98;background:linear-gradient(180deg,#05061A 0%,#141B4D 60%,#2A2478 100%);color:#fff;display:grid;place-items:center;padding:24px;animation:fade .5s}
.nt-stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,rgba(255,255,255,.9),transparent),radial-gradient(1px 1px at 120px 90px,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 220px 40px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 300px 130px,rgba(255,255,255,.5),transparent);background-size:340px 160px;animation:twk 5s ease-in-out infinite alternate}
.nt-box{position:relative;text-align:center;width:min(360px,100%)}
.nt-m{display:flex;justify-content:center;margin-bottom:10px}
.nt-clock{font-family:var(--fd);font-weight:800;font-size:76px;line-height:1;letter-spacing:-.03em}
.nt-sub{font-size:20px;font-weight:700;margin:8px 0 4px}
.nt-info{opacity:.8;margin-bottom:26px}
#night .btn.lg{background:#fff;color:#2A2478;box-shadow:0 14px 30px -14px rgba(255,255,255,.4)}
.nt-links{display:flex;justify-content:center;gap:18px;margin-top:14px}
.nt-links .lnk{color:rgba(255,255,255,.8)}
body.nighting .fab,body.nighting .companion,body.nighting #tour{display:none!important}
.moods button.on{border-color:var(--brand)}

.moods{display:flex;gap:8px;justify-content:space-between}
.moods button{flex:1;height:48px;font-size:24px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);cursor:pointer}
.moods button:active{transform:scale(.94)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.insight:first-of-type{border-top:0}
.insight .ic{font-size:18px;flex:none}

/* ---------- Évolutions ---------- */
.evo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.evo-i{border:1.5px solid var(--line);background:var(--surface2);border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--text);font:inherit}
.evo-i b{font-family:var(--fd);font-size:13px;margin-top:2px}
.evo-i small{font-size:11px;color:var(--muted)}
.evo-i.cur{border-color:var(--brand);background:var(--brand-soft)}
.evo-i:active{transform:scale(.96)}
.evo-av{display:block;height:64px;display:grid;place-items:center}
.evo-i.lock .evo-av svg,.evo-big.lock svg{filter:brightness(0) opacity(.28)}
.hc-form{display:inline-block;font:700 12px var(--fb);background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:3px 12px;margin:2px 0 6px}
.sheet.evo{text-align:center;overflow:hidden}
.evo-t{font:800 12.5px var(--fb);letter-spacing:.16em;color:var(--brand)}
.evo-pair{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 8px}
.evo-old{opacity:.6;filter:saturate(.6)}
.evo-ar{font-size:26px;color:var(--brand)}
.evo-new{animation:evopop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes evopop{0%{transform:scale(.2) rotate(-12deg);filter:brightness(4)}60%{transform:scale(1.2)}100%{transform:none;filter:none}}
.evo-s{font:700 15px var(--fd);margin:0 0 6px;color:var(--text)}
.evo-big{display:flex;justify-content:center;margin:14px 0 4px}
.m-aura{transform-box:view-box;transform-origin:60px 62px}
.mascot.live .m-aura{animation:aura 16s linear infinite}
@keyframes aura{to{transform:rotate(360deg)}}
.m-orb{animation:orbf 3.2s ease-in-out infinite}
.m-orb.o2{animation-delay:-1s}
.m-orb.o3{animation-delay:-2s}
@keyframes orbf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* ---------- Grand Cap ---------- */
.cap-hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(155deg,#10163F 0%,#2B2A8C 55%,#6A3FC4 100%);box-shadow:0 20px 40px -16px rgba(40,30,140,.7)}
.cap-hero>*:not(.sl-st){position:relative}
.cap-hero.empty{text-align:center;padding:26px 20px}
.cap-hero.empty h2{color:#fff;font-size:24px;margin:6px 0}
.cap-hero.empty p{opacity:.88;margin:0 0 18px;line-height:1.45}
.cap-hero .btn{background:#fff;color:#2B2A8C;box-shadow:none}
.cp-star{font-size:30px}
.cp-star.big{font-size:54px;animation:bob 3s ease-in-out infinite}
.cap-top{display:flex;align-items:center;gap:14px}
.cap-tx{flex:1;min-width:0}
.cap-k{font:800 11px var(--fb);letter-spacing:.14em;opacity:.8}
.cap-v{font:700 16px/1.3 var(--fd);margin:4px 0}
.cap-s{font-size:12.5px;opacity:.85}
.caprint .cr1{fill:#fff;font:800 30px var(--fd)}
.caprint .cr3{font-size:15px}
.caprint .cr2{fill:rgba(255,255,255,.75);font:600 9.5px var(--fb)}
.cneedle{transform-box:view-box;transform-origin:65px 65px;animation:cswing 4s ease-in-out infinite}
@keyframes cswing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.cap-boss .hpbar{margin-top:8px}
.cp-rew{display:flex;gap:6px;margin-top:12px}
.cp-rew span{flex:1;text-align:center;background:var(--surface2);border-radius:12px;padding:6px 2px;font:700 12px var(--fd);color:var(--muted)}
.cp-rew span small{display:block;font:600 10px var(--fb)}
.cp-rew span.on{background:var(--brand-soft);color:var(--brand)}
.cp-tl{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.cp-ch{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}
.cp-ch i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ring);background:var(--surface);flex:none}
.cp-ch.done i{background:var(--good);border-color:var(--good)}
.cp-ch.cur i{border-color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}
.cp-ch div{flex:1}
.cp-ch b{display:block;font-size:14.5px}
.cp-ch span{font-size:12px;color:var(--muted)}
.cp-ch em{font-style:normal;font-size:12px;font-weight:700;color:var(--good)}
.cp-ch em.now{color:var(--brand)}
.cp-pil{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.cp-ph{display:flex;align-items:center;gap:12px}
.cp-pc{font-family:var(--fd);font-size:20px}
.cp-g{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 10px;margin-top:6px;background:var(--surface2);border-radius:10px}
.cp-id{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;font-weight:600}
.cp-q{margin-bottom:12px}
.cp-chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.cp-chk input{width:20px;height:20px;flex:none}
.cap-home{border:1.5px solid rgba(91,75,255,.35);background:linear-gradient(180deg,var(--brand-soft),var(--surface))}
.cap-home .cp-row{display:flex;align-items:center;gap:12px}
.cap-home .cp-t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.cap-home .cp-t b{font:700 14.5px/1.3 var(--fd)}
.cap-home .cp-t span{font-size:12.5px;color:var(--muted)}
.cap-home .cp-k{font:800 10.5px var(--fb);letter-spacing:.1em;color:var(--brand)!important}
.cap-home .caprint .cr1{fill:var(--text)}
.cap-home .caprint .cr2{fill:var(--muted)}
.cap-home .caprint circle:first-of-type{stroke:var(--ring)}
.cap-home.promo .cp-star{font-size:34px}
.cp-mis{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.cp-mk{font:800 10.5px var(--fb);letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:4px}
/* ============ Adaptation à l'âge ============ */
body.big{font-size:17px;line-height:1.45}
body.big .rn{font-size:17px}
body.big .rm,body.big .hint,body.big .muted,body.big .small,body.big .fine{font-size:14.5px}
body.big .btn{min-height:54px;font-size:17px}
body.big .btn.sm{min-height:46px;font-size:15.5px}
body.big .chips button,body.big .fchip,body.big .bub,body.big .opt,body.big .seg button{font-size:15.5px;padding-top:12px;padding-bottom:12px}
body.big input,body.big textarea,body.big select{font-size:17px}
body.big .nav button{font-size:12px}
body.big .nav button svg{width:26px;height:26px}
body.big h2{font-size:21px}
body.big h3{font-size:18px}
body.big .pt{font-size:32px}
body.big .hud-chip{font-size:15px;height:38px}
body.big .tbt{font-size:17px}
body.big .tr-tip p{font-size:16px}
body.big .kpi-l,body.big .gst span{font-size:13px}
.age-prompt .opt small{display:block;font-weight:500;opacity:.75}
/* Explorateur (enfants) */
body[data-age=kid] .gamehero{background:linear-gradient(135deg,#FF9A3D 0%,#FF4D8D 55%,#8B5CFF 100%)}
body[data-age=kid] .card,body[data-age=kid] .gcard,body[data-age=kid] .pcard2,body[data-age=kid] .svcard{border-radius:28px}
body[data-age=kid] .btn{border-radius:20px}
body[data-age=kid] .pt{font-size:30px}
body[data-age=kid] .hello{font-size:22px}
body[data-age=kid] .cap-hero,body[data-age=kid] .sl-hero{border-radius:30px}
/* Confort (60 ans et plus) */
body[data-age=senior] .gamehero{background:linear-gradient(135deg,#2D56C8 0%,#4B7BFF 60%,#6C93FF 100%)}
body[data-age=senior] .card{border-width:1.5px}
/* Moins d'animations */
body.calm .spk,body.calm .sl-st,body.calm .nt-stars{display:none}
body.calm .gamehero,body.calm .cap-hero,body.calm .sl-hero{animation:none}
body.calm .mascot,body.calm .mascot *{animation:none!important}
body.calm .xpbar>i::after,body.calm .hpbar>i::after{display:none}
body.calm .stag,body.calm .rv{animation:none;opacity:1;transform:none;transition:none}
body.calm .hud-chip .i,body.calm .flame .i,body.calm .cneedle,body.calm .cp-star.big{animation:none}
body.calm .xpbar>i,body.calm .hpbar>i{transition:none}

/* ================= Parsing intelligent ================= */
function detectDomain(text,doms){
  const words=norm(text).split(/[^a-z0-9-]+/).filter(Boolean);
  let best=null,bs=0;
  (doms||DOMAINS).forEach(d=>{
    let s=0;
    (d.kw||[]).forEach(kw=>{
      const ex=kw[0]==='=',st=ex?kw.slice(1):kw;
      words.forEach(w=>{if(ex?w===st:w.indexOf(st)===0)s++});
    });
    if(s>bs){bs=s;best=d.id}
  });
  return best;
}
function parseMin(text){
  const s=norm(text);
  const mh=s.match(/(\d+(?:[.,]\d+)?)\s*(?:heures?|h)(?![a-z])\s*(\d{1,2})?/);
  if(mh)return Math.round(parseFloat(mh[1].replace(',','.'))*60+(mh[2]?+mh[2]:0));
  const mm=s.match(/(\d+)\s*(?:minutes?|min|mn)(?![a-z])/);
  return mm?+mm[1]:null;
}
function autoPts(min,text){
  let p=min?Math.max(1,Math.min(10,Math.round(min/20))):2;
  if(/\b(termine|fini|finalise|publie|obtenu|signe|decroche|reussi|lance|livre)\b/.test(norm(text)))p+=2;
  return Math.min(p,12);
}
function parseEntry(text,domSel,sizeSel){
  const t=text.trim(),m=parseMin(t),auto=detectDomain(t),qy=parseQty(t);
  const fb=DOMAINS.length?orderedDomains()[0].id:'autre';
  const d=domSel&&domSel!=='auto'?domSel:(auto||fb);
  const p=sizeSel&&sizeSel!=='auto'?+sizeSel:autoPts(m,t);
  return {t,m,d,p,detected:!!auto,q:qy?qy.q:null,u:qy?qy.u:null};
}

const QTY_RE=/(\d+(?:[.,]\d+)?)\s*(km|kilometres?|pages?|mots|kg|litres?|repas|candidatures?|offres?|appels?|e?mails?|pompes|seances?|exercices?|chapitres?|contacts?|clients?|articles?|verres)(?![a-z])/;
const UNIT_MAP={kilometre:'km',kilometres:'km',km:'km',page:'pages',pages:'pages',mots:'mots',kg:'kg',litre:'L',litres:'L',repas:'repas',candidature:'candidatures',candidatures:'candidatures',offre:'offres',offres:'offres',appel:'appels',appels:'appels',mail:'mails',mails:'mails',email:'mails',emails:'mails',pompes:'pompes',seance:'séances',seances:'séances',exercice:'exercices',exercices:'exercices',chapitre:'chapitres',chapitres:'chapitres',contact:'contacts',contacts:'contacts',client:'clients',clients:'clients',article:'articles',articles:'articles',verres:'verres'};
function parseQty(text){
  const s=norm(text);
  const e=s.match(/(\d+(?:[.,]\d+)?)\s*(€|euros?)(?![a-z])/);
  if(e)return {q:parseFloat(e[1].replace(',','.')),u:'€'};
  const m=s.match(QTY_RE);
  return m?{q:parseFloat(m[1].replace(',','.')),u:UNIT_MAP[m[2]]||m[2]}:null;
}
function splitEntries(text){
  return text.split(/\s*[;\n+]\s*|\s+puis\s+|,\s+(?=[^\d])/i).map(x=>x.trim()).filter(x=>x.length>=2).slice(0,6);
}
function parseDue(text){
  const s=norm(text),t=todayK();let due=null;
  if(/apres[- ]demain/.test(s))due=addDays(t,2);
  else if(/\bdemain\b/.test(s))due=addDays(t,1);
  else{
    const m=s.match(/\bdans (\d+) jours?\b/);
    if(m)due=addDays(t,+m[1]);
    else{
      const wd=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
      for(let i=0;i<7;i++){if(new RegExp('\\b'+wd[i]+'\\b').test(s)){let diff=(i-parse(t).getDay()+7)%7;if(diff===0)diff=7;due=addDays(t,diff);break}}
    }
  }
  return {due:due,star:/(^\s*!)|\b(urgent|important|prioritaire)\b/.test(s)};
}

/* ================= Lien automatique accomplissement → étape d'objectif ================= */
const STOP=['les','des','une','mon','mes','pour','dans','avec','sur','par','aux','que','qui','est','ses','ces','ton','tes','son','mon'];
function toks(s){return norm(s).split(/[^a-z0-9]+/).filter(w=>w&&STOP.indexOf(w)<0&&(w.length>=3||/^\d+$/.test(w))).map(w=>/^\d+$/.test(w)?w:w.slice(0,4))}
function matchMs(accText,msText){
  const a=toks(accText),b=toks(msText);if(!b.length)return false;
  const isN=x=>/^\d+$/.test(x),nums=b.filter(isN),words=b.filter(x=>!isN(x));
  if(!words.length)return false;
  const aw=a.filter(x=>!isN(x)),an=a.filter(isN),qa=parseQty(accText),nm=norm(msText);
  for(let i=0;i<nums.length;i++){
    const n=+nums[i],exact=an.indexOf(nums[i])>=0,bigger=qa&&qa.q>=n&&nm.indexOf(norm(qa.u))>=0;
    if(!exact&&!bigger)return false;
  }
  const shared=words.filter(w=>aw.indexOf(w)>=0).length;
  return shared>=Math.min(2,words.length)&&shared/words.length>=.6;
}

}

  [/(guitare|piano|dessin|peinture|musique|photo|creer|chant)/,['Choisir mon projet et mon matériel','Pratiquer 10 minutes par jour pendant une semaine','Finir une première pièce simple','Atteindre la moitié du projet','Le montrer à quelqu\'un','Finaliser']],
  [/(ami|famille|couple|relation|sortie|reseau)/,['Lister les personnes importantes','Planifier le premier moment ensemble','Tenir un rythme régulier pendant un mois','Organiser un moment plus marquant','Faire le point sur ce qui compte','Installer le rituel']]
];
const ROAD_DEFAULT=['Préciser ce que ce résultat signifie concrètement','Planifier la première action cette semaine','Terminer la première étape concrète','Atteindre la moitié du chemin','Franchir la dernière ligne droite','Atteindre l\'objectif et faire le bilan'];
const ROAD_ALTS=[
  ['Écrire mon objectif et pourquoi il compte','Découper le chemin en 3 grandes parties','Terminer la première partie','Terminer la deuxième partie','Terminer la troisième partie','Atteindre l\'objectif et célébrer'],
  ['Définir ma mesure de réussite','Faire un premier essai simple','Tenir 2 semaines de suite','Évaluer et ajuster ma méthode','Passer à la vitesse supérieure','Atteindre l\'objectif']
];
function numRoadmap(title){
  const m=title.match(/(\d[\d\s.,]*\d|\d)\s*(€|euros?|km|kg|livres?|pages?|mots|heures?|clients?|candidatures?|séances?|seances?|articles?|abonnés)/i);
  if(!m)return null;
  const T=parseFloat(m[1].replace(/\s/g,'').replace(',','.'));if(!(T>0))return null;
  const u=m[2].toLowerCase().replace(/^euros?$/,'€').replace(/^livre$/,'livres');
  const f=v=>{v=Math.round(v*10)/10;return (v>=1000?String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,' '):String(v).replace('.',','))+' '+u};
  return [25,50,75].map(p=>'Atteindre '+p+' % ('+f(T*p/100)+')').concat(['Atteindre '+f(T)]);
}
function roadmapFor(title,domain,variant){
  const v=(variant||0)%(ROAD_ALTS.length+1),fam=ROADMAPS.find(r=>r[0].test(norm(title)))||ROADMAPS.find(r=>r[0].test(norm(domain||''))),num=numRoadmap(title);
  const base=v===0?(fam?fam[1]:ROAD_DEFAULT):ROAD_ALTS[v-1];
  if(num)return base.slice(0,2).concat(num).slice(0,8);
  return base.slice();
}
function makeGoal(title,d,weeks,ms){
  const t=todayK(),w=Math.max(2,Math.min(104,weeks||12)),n=Math.max(1,ms.length);
  return {id:gid(),t:title,d:d,due:addDays(t,w*7),progress:0,done:false,created:t,auto:true,
    ms:ms.map((x,i)=>({id:gid(),t:x,done:false,doneDate:null,p:3,due:addDays(t,Math.round((i+1)*w*7/n))}))};
}
function parseWeeks(s){
  const n=norm(s);
  let m=n.match(/(?:d'ici|dans|en|sur|pendant)\s+(\d+)\s*(semaines?|mois|ans?|jours?)/);
  if(m){const v=+m[1],u=m[2];return u.indexOf('semaine')===0?v:u==='mois'?Math.round(v*4.35):u.indexOf('an')===0?v*52:Math.max(1,Math.round(v/7))}
  const months=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  m=n.match(/(?:d'ici|pour|avant|en)\s+(?:fin\s+)?(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)/);
  if(m){const idx=months.indexOf(m[1]),now=new Date();let d=new Date(now.getFullYear(),idx+1,0);if(d<now)d=new Date(now.getFullYear()+1,idx+1,0);return Math.max(2,Math.round((d-now)/6048e5))}
  return null;
}
function parseGoalText(raw){
  let t=raw.trim();const wk=parseWeeks(t);
  t=t.replace(/^(je veux|je voudrais|j'?aimerais|je souhaite|je vise|je compte|aide[- ]moi à|mon objectif( est| c'est)?|objectif|nouvel objectif|ajoute (un )?objectif)\s*:?\s*/i,'');
  t=t.replace(/\s*(d'ici|dans|en|sur|pour|avant)\s+(\d+\s*(semaines?|mois|ans?|jours?)|(fin\s+)?(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre))\b.*$/i,'').trim();
  t=t.charAt(0).toUpperCase()+t.slice(1);
  if(!t)t=raw.trim();
  return {title:cleanS(t,90),domain:safeDom(null,t),weeks:wk||13};
}

/* ---------- Intention du message ---------- */
function intentOf(text){
  const s=norm(text).trim(),raw=text.trim();
  if(/\b(j'?arrete|arreter|arret|stop|sevrage|j'?arrête)\b/.test(s)&&quitKeyOf(text))return ageHas('sevrage')?'quit':'safe';
  if(S.core.addictions&&S.core.addictions.length&&/(craque|rechute|replonge|j'?ai (re)?fume|j'?ai bu|j'?ai (re)?joue)/.test(s))return 'relapse';
  if(/\benvie\b|\bsos\b/.test(s)&&/(fumer|cigarette|clope|boire|verre|alcool|vaper|vape|joint|cannabis|craquer|jouer|parier|scroller|sucre|manger|porn)/.test(s))return ageHas('sevrage')?'urge':'safe';
  if(/^(planifi|organise|prepare|donne.?moi un plan|que (dois|puis)|quoi faire|aide.?moi a (planifier|organiser))/.test(s)||/plan(ning)? du jour|planifie ma|organise ma/.test(s))return 'plan';
  if(/^(je veux|je voudrais|j'?aimerais|je souhaite|mon objectif|objectif|je vise|je compte|ajoute (un )?objectif|nouvel objectif|aide.?moi a)/.test(s))return 'goal';
  if(/^(chaque|tous les|routine)/.test(s)||/\bchaque (jour|matin|soir|semaine|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/.test(s))return 'routine';
  if(/^(rappelle|rappel|a faire|todo|n'?oublie pas|penser a|je dois|il faut)/.test(s)||/\b(demain|apres.demain|dans \d+ jours?)\b/.test(s))return 'task';
  if(/\b(mon (grand )?cap|ma vision|mon objectif (final|principal|ultime)|etoile polaire|ma mission du jour|quelle est ma mission)\b/.test(s)&&ageHas('cap'))return 'cap';
  if(parseSleep(text))return 'sleep';
  {const pm=parseMetric(text);if(pm&&metricPresetsFor().some(m=>m.key===pm.key))return 'metric'}
  if(/\b(bilan|resume|ou j'en suis|mes progres|comment je vais|statistiques|mon score)\b/.test(s))return 'stats';
  if(/\b(conseil|astuce|coup de mou|motive|motivation|decourage|je n'arrive pas)\b/.test(s))return 'tip';
  if(/\?\s*$/.test(raw)||/^(comment|pourquoi|quel|quelle|quels|combien|que |qu'|est.ce|peux.tu|aide)/.test(s))return 'ask';
  return 'log';
}

const CAP_RULES='Tu es Cap, un coach bienveillant, concret et bref, dans une application de suivi d\'accomplissements. Tu tutoies et réponds en français.\nTu réponds UNIQUEMENT par un objet JSON : {"reply":"1 à 3 phrases","actions":[...]}.\nActions possibles :\n- {"type":"log","text":"ce que l\'utilisateur a accompli, tel qu\'il l\'a dit","domain":"<id>","minutes":nombre ou null,"points":1 à 10}\n- {"type":"goal","title":"objectif à l\'infinitif","domain":"<id>","weeks":2 à 52,"milestones":["5 à 7 étapes concrètes, mesurables, dans l\'ordre"]}\n- {"type":"routine","title":"...","domain":"<id>","points":1 à 5,"days":[nombres de 0 à 6, 0=dimanche]}\n- {"type":"task","title":"...","domain":"<id>","due":"AAAA-MM-JJ" ou null,"star":true ou false}\nRègles : n\'invente jamais un accomplissement que l\'utilisateur n\'a pas déclaré ; pour un objectif, construis toi-même la feuille de route complète (l\'utilisateur ne doit rien détailler) ; pour « planifie ma journée », crée 3 à 5 actions "task" datées d\'aujourd\'hui, réalistes pour l\'objectif de points ; n\'utilise que les ids de domaine fournis ; si c\'est une question, réponds dans "reply" sans action ; aucun texte hors du JSON.';
function chatPrompt(msg){
  const h=chat.slice(-6,-1).map(m=>(m.role==='user'?'Utilisateur : ':'Cap : ')+cleanS(m.text,200)).join('\n');
  return CAP_RULES+'\n\nContexte (JSON) :\n'+JSON.stringify(aiCtx())+(h?'\n\nDerniers échanges :\n'+h:'')+'\n\nMessage de l\'utilisateur : '+JSON.stringify(msg);
}
function normalizeAi(r){
  if(!r||typeof r!=='object')return null;
  const acts=Array.isArray(r.actions)?r.actions.filter(a=>a&&typeof a==='object').slice(0,8):[];
  return {reply:cleanS(r.reply,420),actions:acts};
}

/* ---------- Exécution des actions (IA ou règles locales) ---------- */
function actLog(a){
  const text=cleanS(a.text,140);if(!text)return null;
  const e=parseEntry(text,safeDom(a.domain,text),'auto'),k=viewDate;
  const mins=clampN(a.minutes,1,720)||e.m,pts=clampN(a.points,1,12)||e.p;
  const acc=addAcc(k,{t:text,d:e.d,p:pts,m:mins,q:e.q,u:e.u,s:'manual'});
  return {icon:'check',text:text+' (+'+pts+' pts)',undo:{k:'acc',date:k,id:acc.id},link:autoLink(k,acc)};
}
function actGoal(a){
  const title=cleanS(a.title,90);if(!title)return null;
  const nk=x=>norm(x).replace(/[^a-z0-9]/g,'');
  if(S.core.goals.some(g=>nk(g.t)===nk(title)))return {icon:'target',text:'Objectif déjà présent : '+title};
  const d=safeDom(a.domain,title);
  let ms=Array.isArray(a.milestones)?a.milestones.map(x=>cleanS(x,100)).filter(Boolean).slice(0,8):[];
  if(ms.length<3)ms=roadmapFor(title,d);
  const g=makeGoal(title,d,clampN(a.weeks,2,104)||13,ms);S.core.goals.push(g);
  return {icon:'target',text:'Objectif créé : '+title+' ('+g.ms.length+' étapes)',undo:{k:'goal',id:g.id}};
}
function actRoutine(a){
  const title=cleanS(a.title,80);if(!title)return null;
  if(S.core.routines.some(r=>norm(r.t)===norm(title)))return {icon:'repeat',text:'Routine déjà présente : '+title};
  let days=Array.isArray(a.days)?Array.from(new Set(a.days.map(Number).filter(x=>x>=0&&x<=6))):[];
  if(!days.length)days=[0,1,2,3,4,5,6];
  const r={id:gid(),t:title,d:safeDom(a.domain,title),p:clampN(a.points,1,5)||2,days:days,created:todayK(),on:true};
  S.core.routines.push(r);
  return {icon:'repeat',text:'Routine créée : '+title+' ('+daysLabel(days).toLowerCase()+')',undo:{k:'routine',id:r.id}};
}
function actTask(a){
  const title=cleanS(a.title,120);if(!title)return null;
  const pd=parseDue(title),e=parseEntry(title,safeDom(a.domain,title),'auto');
  let due=/^\d{4}-\d{2}-\d{2}$/.test(a.due||'')?a.due:pd.due;if(due&&due<todayK())due=null;
  const star=!!a.star||pd.star,t={id:gid(),t:title,d:e.d,p:e.p+(star?1:0),m:e.m,star:star,due:due||null,done:false,created:todayK()};
  S.core.tasks.push(t);
  return {icon:'calendar',text:'Tâche : '+title+(due&&due>todayK()?' ('+fmtShort(due)+')':''),undo:{k:'task',id:t.id}};
}
function runActions(list){
  const out=[];
  (list||[]).forEach(a=>{
    let r=null;
    try{r=a.type==='capopen'?actCapOpen(a):a.type==='sleep'?actSleep(a):a.type==='quit'?actQuit(a):a.type==='relapse'?actRelapse(a):a.type==='urge'?actUrge(a):a.type==='metric'?actMetric(a):a.type==='log'?actLog(a):a.type==='goal'?actGoal(a):a.type==='routine'?actRoutine(a):a.type==='task'?actTask(a):null}catch(e){console.error(e)}
    if(r)out.push(r);
  });
  if(out.length)markDirty('core');
  return out;
}
function undoReceipt(u){
  if(u.k==='acc'){const a=accsOf(u.date).find(x=>x.id===u.id);if(a){removeAcc(u.date,a.id);if(a.r)revert(a);unlinkAcc(a)}}
  else if(u.k==='goal')S.core.goals=S.core.goals.filter(g=>g.id!==u.id);
  else if(u.k==='routine')S.core.routines=S.core.routines.filter(r=>r.id!==u.id);
  else if(u.k==='task')S.core.tasks=S.core.tasks.filter(t=>t.id!==u.id);
  else if(u.k==='metric')undoMetric(u);
  else if(u.k==='sleep')undoSleep(u);
  else if(u.k==='addiction'||u.k==='relapse')undoSev(u);
  markDirty('core');
}

/* ---------- Règles locales quand l'IA n'est pas disponible ---------- */
function localHandle(raw,it){
  if(it==='goal'){
    const g=parseGoalText(raw),ms=roadmapFor(g.title,g.domain);
    return {reply:'C\'est noté. J\'ai préparé une feuille de route de '+ms.length+' étapes pour « '+g.title+' », sur environ '+g.weeks+' semaines. Tu la retrouves dans Parcours : je valide les étapes tout seul quand tu me dis ce que tu fais.',actions:[{type:'goal',title:g.title,domain:g.domain,weeks:g.weeks,milestones:ms}]};
  }
  if(it==='routine'){
    const s=norm(raw),names=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],days=[];
    names.forEach((n,i)=>{if(s.indexOf(n)>=0)days.push(i)});
    let title=raw.replace(/^(chaque jour|tous les jours|chaque (matin|soir|semaine)|routine\s*:?)\s*/i,'').replace(/\bchaque (lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/ig,'').trim();
    title=cleanS(title.charAt(0).toUpperCase()+title.slice(1)||raw,80);
    return {reply:'Routine programmée. Elle apparaîtra toute seule dans ta liste les jours prévus.',actions:[{type:'routine',title:title,domain:safeDom(null,title),points:2,days:days}]};
  }
  if(it==='task'){
    const title=cleanS(raw.replace(/^(rappelle[- ]moi( de)?|rappel\s*:?|à faire\s*:?|a faire\s*:?|n'oublie pas de|je dois|il faut)\s*/i,''),120);
    return {reply:'C\'est ajouté à ta liste : tu la verras le jour prévu.',actions:[{type:'task',title:title.charAt(0).toUpperCase()+title.slice(1),domain:safeDom(null,title)}]};
  }
  if(it==='plan'){
    const goal=S.core.set.daily,left=Math.max(0,goal-ptsOf(todayK())),acts=[];
    const open=todoItems(todayK()).filter(i=>!i.done);
    suggestions(todayK()).slice(0,3).forEach(s=>{if(acts.length<3)acts.push({type:'task',title:s.t,domain:s.d,star:acts.length===0,due:todayK()})});
    return {reply:open.length?'Tu as déjà '+plural(open.length,'élément')+' prévu'+(open.length>1?'s':'')+' aujourd\'hui. J\'y ajoute '+plural(acts.length,'action')+' pour atteindre tes '+goal+' pts'+(left?' (encore '+left+' à gagner)':'')+'.':'Voici '+plural(acts.length,'action')+' pour atteindre tes '+goal+' pts aujourd\'hui. Commence par la première.',actions:acts};
  }
  if(it==='quit'){const key=quitKeyOf(raw);return {reply:'Bravo de te lancer. Je te pose quelques questions pour construire un vrai plan : depuis quand, combien, tes déclencheurs, ton objectif et ta motivation. Réponds honnêtement, personne ne te juge.',actions:[{type:'quit',key:key}]}}
  if(it==='relapse'){const key=quitKeyOf(raw);return {reply:'Ça arrive, et ça n\'efface rien de ce que tu as construit. Tu repars de zéro tout de suite. Note ce qui l\'a déclenché dans l\'onglet Sevrage pour mieux l\'anticiper.',actions:[{type:'relapse',key:key}]}}
  if(it==='urge')return {reply:'Respire. Une envie dure quelques minutes puis redescend : je t\'ouvre le mode SOS.',actions:[{type:'urge'}]}
  if(it==='safe')return {reply:'Pour ça, le mieux est d\'en parler à un adulte de confiance : un parent, un médecin ou l\'infirmier de l\'école. Je suis là pour t\'aider avec tes missions et tes habitudes du quotidien.',actions:[]};
  if(it==='cap')return {reply:capReply(),actions:S.core.cap?[]:[{type:'capopen'}]};
  if(it==='sleep'){const ps=parseSleep(raw);return {reply:'',actions:[{type:'sleep',bed:ps.bed,wake:ps.wake,dur:ps.dur}]}}
  if(it==='metric'){const pm=parseMetric(raw);return {reply:'',actions:[{type:'metric',key:pm.key,value:pm.v}]}}
  if(it==='stats')return {reply:statsReply(),actions:[]};
  if(it==='tip')return {reply:tipReply(),actions:[]};
  if(it==='ask')return {reply:'Je peux enregistrer ce que tu accomplis, créer des objectifs avec leur feuille de route, programmer des routines ou planifier ta journée. Dis-moi simplement ce que tu veux, par exemple « Je veux apprendre l\'anglais d\'ici 6 mois ».',actions:[]};
  const parts=splitEntries(raw);
  return {reply:'',actions:parts.map(pt=>{const e=parseEntry(pt,'auto','auto');return {type:'log',text:pt,domain:e.d,minutes:e.m,points:e.p}})};
}
function replyFor(rc){
  const logs=rc.filter(r=>r.undo&&r.undo.k==='acc');
  if(rc.length===1&&rc[0].undo&&rc[0].undo.k==='sleep')return 'Nuit enregistrée. Retrouve ton score, ta régularité et tes tendances dans Stats > Sommeil.';
  if(rc.length===1&&rc[0].undo&&rc[0].undo.k==='metric')return 'Mesure enregistrée. Chaque donnée te rapproche d\'une version optimisée de toi.';
  if(!rc.length)return 'Je n\'ai rien pu enregistrer avec ce message. Dis-moi ce que tu as fait, ou un objectif à atteindre.';
  const pts=sum(logs.map(r=>+((r.text.match(/\+(\d+) pts/)||[])[1]||0))),goal=S.core.set.daily,left=goal-ptsOf(viewDate);
  const msgs=['Bien joué !','Belle avancée !','Ça compte !','Excellent !'];
  let s=msgs[Math.floor(Math.random()*msgs.length)]+(pts?' +'+pts+' XP.':'');
  s+=left>0?' Plus que '+left+' pour ton objectif du jour.':' Objectif du jour atteint !';
  const lk=sum(rc.map(r=>(r.link||[]).length));
  if(lk)s+=' J\'ai aussi validé '+plural(lk,'étape')+' de tes objectifs.';
  return s;
}
function statsReply(){

function tipReply(){

/* ---------- Envoi d'un message ---------- */
function scrollThread(){const t=$('#thread');if(t&&t.scrollHeight)t.scrollTop=t.scrollHeight}
async function sendChat(raw){
  raw=(raw||'').trim();if(!raw||chatBusy)return;
  draft.qa='';chat.push({role:'user',text:raw,fresh:true});if(chat.length>40)chat.shift();
  const it=intentOf(raw),parts=splitEntries(raw);
  const undetected=it==='log'&&parts.some(p=>!parseEntry(p,'auto','auto').detected);
  const useAi=aiState!=='off'&&(it!=='log'||undetected);
  const b=snap();let res=null;
  if(useAi){
    chatBusy=true;render();scrollThread();
    try{res=normalizeAi(await askJson(chatPrompt(raw)))}
    catch(e){res=null;if(e&&e.code==='rate_limited')toast('Cap est très sollicité : j\'utilise mes règles intégrées','sparkles')}
  }
  if(!res)res=localHandle(raw,it);
  const rc=runActions(res.actions);
  chatBusy=false;
  chat.push({role:'cap',text:res.reply||replyFor(rc),receipts:rc,fresh:true});
  render();scrollThread();setTimeout(()=>chat.forEach(x=>{x.fresh=false}),800);
  celebrate(b,snap(),rc.length>1?plural(rc.length,'accomplissement'):'');
  rc.forEach((r,i)=>(r.link||[]).forEach((x,j)=>setTimeout(()=>toast('Étape validée : '+x[1].t,'target'),1500+(i+j)*1600)));
  if(rc.some(r=>r.undo&&r.undo.k==='goal'))setTimeout(()=>toast('Feuille de route créée : voir Parcours','target'),1200);
}

function refineGoal(id){
  const g=S.core.goals.find(x=>x.id===id);if(!g)return;

  const w=Math.max(2,Math.round((parse(g.due||addDays(todayK(),91))-parse(todayK()))/6048e5)),n=Math.max(1,ms.length),t=todayK();
  g.ms=doneMs.concat(ms.map((x,i)=>({id:gid(),t:x,done:false,doneDate:null,p:3,due:addDays(t,Math.round((i+1)*w*7/n))})));

/* ---------- Plan de départ du questionnaire ---------- */
function planPrompt(w){
  const doms=orderedSel(w).map(id=>{const l=libOf(w,id);return {id:id,nom:l.name}});
  const data={prenom:w.name.trim(),situation:(SIT_LABEL[w.situation]||'').replace(/^\S+\s/,''),moment_en_forme:(CHRONO_LABEL[w.chrono]||'').replace(/^\S+\s/,''),
    domaines_par_ordre_importance:doms,minutes_par_jour:+w.minutes,ambition:(INTENS.find(x=>x[0]===w.intensity)||['','',''])[1].replace(/^\S+\s/,''),
    jours_repos:w.rest.map(d=>WD[d]),freins:w.obstacles,cap_personnel:w.why.trim(),souhait:w.wish.trim(),horizon_semaines:(HORIZONS.find(x=>x[0]===w.horizon)||HORIZONS[1])[2]/7|0};
  return 'Tu es Cap, coach concret et réaliste. Construis le plan de départ de cet utilisateur à partir de ses réponses (JSON) :\n'+JSON.stringify(data)+'\n\nRéponds UNIQUEMENT par un JSON : {"goals":[{"title":"objectif à l\'infinitif","domain":"<id>","weeks":2 à 52,"milestones":["5 à 7 étapes concrètes, mesurables, dans l\'ordre"]}],"routines":[{"title":"...","domain":"<id>","points":1 à 5,"days":[0 à 6, 0=dimanche]}]}\nRègles : 2 à 3 objectifs ; au moins un pour chacun des 2 domaines les plus importants ; si "souhait" est renseigné, le premier objectif y répond ; 3 à 6 routines légères, adaptées au temps disponible et aux jours de repos ; n\'utilise que les ids de domaine fournis ; l\'utilisateur ne doit rien avoir à détailler.';
}
function normalizePlan(r,w){
  if(!r||typeof r!=='object')return null;
  const ids=w.sel,goals=[],routines=[];
  (Array.isArray(r.goals)?r.goals:[]).slice(0,3).forEach(g=>{
    const title=cleanS(g&&g.title,90);if(!title)return;
    const d=ids.indexOf(g.domain)>=0?g.domain:(detectDomain(title,ids.map(id=>libOf(w,id)))||ids[0]);
    let ms=Array.isArray(g.milestones)?g.milestones.map(x=>cleanS(x,100)).filter(Boolean).slice(0,8):[];
    if(ms.length<3)ms=roadmapFor(title,d);
    goals.push({title:title,domain:d,weeks:clampN(g.weeks,2,104)||13,milestones:ms,on:true});
  });
  (Array.isArray(r.routines)?r.routines:[]).slice(0,6).forEach(x=>{
    const title=cleanS(x&&x.title,80);if(!title)return;
    const d=ids.indexOf(x.domain)>=0?x.domain:(detectDomain(title,ids.map(id=>libOf(w,id)))||ids[0]);
    const days=Array.isArray(x.days)?Array.from(new Set(x.days.map(Number).filter(n=>n>=0&&n<=6))):[];
    routines.push({title:title,domain:d,points:clampN(x.points,1,5)||1,days:days.length?days:[0,1,2,3,4,5,6],on:true});
  });
  return goals.length?{goals:goals,routines:routines}:null;
}
function localPlan(w){
  const tops=topDomains(w),hz=HORIZONS.find(x=>x[0]===w.horizon)||HORIZONS[1],weeks=Math.max(2,Math.round(hz[2]/7)),goals=[],all=orderedSel(w).map(id=>libOf(w,id));
  const wish=w.wish.trim();
  if(wish){const g=parseGoalText(wish),d=detectDomain(g.title,all)||tops[0];goals.push({title:g.title,domain:d,weeks:parseWeeks(wish)||weeks,milestones:roadmapFor(g.title,d),on:true})}
  tops.forEach(id=>{
    if(goals.length>=3||goals.some(g=>g.domain===id))return;
    const l=libOf(w,id),ideas=l.goals||[],t=ideas.length?ideas[(w.regen||0)%ideas.length]:'Progresser en '+l.name.toLowerCase();
    goals.push({title:t,domain:id,weeks:weeks,milestones:roadmapFor(t,id,w.regen||0),on:true});
  });
  const routines=[];
  orderedSel(w).forEach((id,i)=>{(libOf(w,id).routines||[]).forEach((r,j)=>{if(routines.length<6&&((i<2)||(i<4&&j===0)))routines.push({title:r[0],domain:id,points:r[1],days:suggDays(r[2],w.rest),on:true})})});
  return {goals:goals,routines:routines};
}

  if(aiState!=='off'){
    try{const p=normalizePlan(await askJson(planPrompt(w),ctl),w);if(p)return p}catch(e){}

  return localPlan(w);
}

function radarSVG(cur,bas){
  const W=360,H=330,cx=180,cy=165,R=104,n=DOMAINS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/10,cy+Math.sin(ang(i))*R*v/10];
  const poly=a=>a.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Équilibre des domaines">';
  [2.5,5,7.5,10].forEach(r=>{s+='<polygon class="ringc" points="'+poly(DOMAINS.map(()=>r))+'"/>'});
  DOMAINS.forEach((d,i)=>{
    const p=pt(i,10),q=pt(i,11.9),c=Math.cos(ang(i));
    s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/><text x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" text-anchor="'+(Math.abs(c)<.2?'middle':c>0?'start':'end')+'">'+esc(d.short)+'</text>';
  });
  if(bas)s+='<polygon points="'+poly(bas)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>';
  s+='<polygon points="'+poly(cur)+'" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  cur.forEach((v,i)=>{const p=pt(i,v);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+DOMAINS[i].color+'" stroke="var(--surface)" stroke-width="2"/>'});
  return s+'</svg>';
}
function barsSVG(keys){
  let buckets;
  if(keys.length<=31)buckets=keys.map(k=>({label:fmtShort(k),vals:domPts([k])}));
  else{
    const g={};keys.forEach(k=>{const w=weekStart(k);(g[w]=g[w]||[]).push(k)});
    buckets=Object.keys(g).sort().slice(-52).map(w=>({label:'sem. '+fmtShort(w),vals:domPts(g[w])}));
  }
  const W=420,H=240,pl=30,pr=8,pt=10,pb=26,n=buckets.length;
  const tot=buckets.map(b=>sum(b.vals));
  let mx=Math.max(5,...tot);mx=Math.ceil(mx/5)*5;
  const y=v=>pt+(mx-v)*(H-pt-pb)/mx,slot=(W-pl-pr)/n,bw=Math.min(30,slot*.72);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Points par période">';
  [0,mx/2,mx].forEach(v=>{s+='<line class="axis" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'});

/* ================= Actions ================= */
function toggleItem(kind,id){
  const k=viewDate,b=snap();
  if(kind==='r'){
    const r=S.core.routines.find(x=>x.id===id);if(!r)return;
    if(accsOf(k).some(a=>a.r===id))removeRef(k,id);else addAcc(k,{t:r.t,d:r.d,p:r.p,s:'routine',r:id});
  }else if(kind==='t'){
    const t=S.core.tasks.find(x=>x.id===id);if(!t)return;
    if(!t.done){t.done=true;t.doneDate=k;addAcc(k,{t:t.t,d:t.d,p:t.p,m:t.m,s:'task',r:id})}
    else{t.done=false;removeRef(t.doneDate||k,id);t.doneDate=null}
  }else if(kind==='m'){
    const g=findGoalOfMs(id);if(!g)return;const ms=g.ms.find(x=>x.id===id);
    if(!ms.done){
      ms.done=true;ms.doneDate=k;addAcc(k,{t:ms.t+' · '+g.t,d:g.d,p:ms.p||3,s:'goal',r:id});
      if(g.ms.every(x=>x.done)&&!g.done){g.done=true;g.doneDate=k;addAcc(k,{t:'🏆 Objectif atteint : '+g.t,d:g.d,p:5,s:'goal',r:g.id})}
    }else{
      removeRef(ms.doneDate||k,id);ms.done=false;ms.doneDate=null;
      if(g.done){g.done=false;removeRef(g.doneDate||k,g.id);g.doneDate=null}
    }
  }
  markDirty('core');justDone=kind+id;render();
  const a=snap();if(a.pts>b.pts||a.gd>b.gd)celebrate(b,a);if(kind==='m')bossHit(id);
}
const toTop=()=>window.scrollTo(0,0);
const isRedo=()=>!!(S.core.profile&&S.core.profile.done);
const actions={
  tab(b){view=b.dataset.v;render();toTop()},
  fab(){view='today';viewDate=todayK();render();toTop();const i=$('#qa');if(i)i.focus()},
  pickday(b){viewDate=b.dataset.k;render()},
  wkprev(){viewDate=addDays(viewDate,-7);render()},
  wknext(){const n=addDays(viewDate,7);viewDate=n>todayK()?todayK():n;render()},
  ex(b){draft.qa=b.dataset.t;fillDrafts($('#main'));updatePreview()},
  qadd:submitQuick,tadd:submitTask,
  tog(b){toggleItem(b.dataset.kind,b.dataset.id)},
  delacc(b){
    const k=b.dataset.k,a=accsOf(k).find(x=>x.id===b.dataset.id);if(!a)return;
    removeAcc(k,a.id);if(a.r)revert(a);unlinkAcc(a);render();
  },
  togform(b){
    const f=b.dataset.f;
    if(f==='goal')goalFormOpen=!goalFormOpen;else if(f==='routine')routFormOpen=!routFormOpen;else taskFormOpen=!taskFormOpen;
    render();
  },
  period(b){period=b.dataset.v==='all'?'all':+b.dataset.v;render()},
  hfilter(b){histDom=b.dataset.v;histLimit=60;render()},
  theme(b){const v=b.dataset.v;try{localStorage.setItem('cap-theme',v)}catch(e){}applyTheme(v);render()},
  copy(b){
    const t=window._report||'';
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copié'}).catch(()=>{b.textContent='Copie impossible'});
  },
  addgoal(){
    const t=(draft.gt||'').trim();if(!t)return;
    const steps=(draft.gsteps||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);
    const d=draft.gdom&&draft.gdom!=='auto'?draft.gdom:(detectDomain(t)||'perso');
    S.core.goals.push({id:gid(),t:t,d:d,due:draft.gdue||null,progress:0,done:false,created:todayK(),ms:steps.map(s=>({id:gid(),t:s,done:false,doneDate:null,p:3}))});
    draft.gt='';draft.gsteps='';draft.gdue='';goalFormOpen=false;markDirty('core');render();toast('Objectif créé','target');
  },

let _ac=null;
function sfx(k){
  if(soundOff())return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    _ac=_ac||new AC();if(_ac.state==='suspended')_ac.resume();
    const SEQ={coin:[[988,.07],[1319,.2]],ok:[[660,.06],[880,.1]],quest:[[523,.1],[659,.1],[784,.1],[1047,.3]],level:[[392,.1],[523,.1],[659,.1],[784,.1],[1047,.4]],hit:[[200,.07],[110,.16]],pet:[[784,.05],[988,.05],[1175,.09]],boing:[[260,.05],[520,.09]],chest:[[300,.08],[500,.08],[700,.1],[1100,.35]]}[k]||[];
    let t=_ac.currentTime;
    SEQ.forEach(x=>{const o=_ac.createOscillator(),g=_ac.createGain();o.type=k==='hit'?'sawtooth':'square';o.frequency.value=x[0];g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+x[1]);o.connect(g);g.connect(_ac.destination);o.start(t);o.stop(t+x[1]);t+=x[1]*.92});
  }catch(e){}
}

const QDEF={
  xp:{ic:'bolt',t:n=>'Gagne '+n+' XP',n:()=>Math.max(4,Math.round(S.core.set.daily*.8)),p:k=>ptsOf(k),r:20},
  doms:{ic:'sparkles',t:n=>'Progresse dans '+n+' domaine'+(n>1?'s':''),n:()=>Math.min(2,Math.max(1,DOMAINS.length)),p:k=>new Set(accsOf(k).map(a=>a.d)).size,r:15},

  acc:{ic:'check',t:n=>'Enregistre '+n+' accomplissements',n:()=>3,p:k=>accsOf(k).length,r:10},
  time:{ic:'clock',t:n=>'Investis '+n+' minutes',n:()=>30,p:k=>sum(accsOf(k).map(a=>a.m||0)),r:20},
  goal:{ic:'target',t:()=>'Franchis une étape de boss',n:()=>1,p:k=>accsOf(k).filter(a=>a.s==='goal').length,r:25,ok:()=>S.core.goals.some(g=>!g.done&&g.ms.some(m=>!m.done))},
  top:{ic:'star',t:()=>'Agis dans ton domaine n°1',n:()=>1,p:k=>accsOf(k).filter(a=>a.d===topDomId()).length,r:15,ok:()=>!!topDomId()}
};
function dailyQuests(k){
  const g=G();
  if(!g.qs[k]){
    const ids=Object.keys(QDEF).filter(id=>id!=='xp'&&(!QDEF[id].ok||QDEF[id].ok()));
    let seed=parseInt(k.replace(/-/g,''),10);const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
    const pick=['xp'];while(pick.length<3&&ids.length){pick.push(ids.splice(Math.floor(rnd()*ids.length),1)[0])}
    g.qs[k]=pick;markDirty('core');
  }
  return g.qs[k].map(id=>{const d=QDEF[id],n=d.n(),v=d.p(k);return {id:id,ic:d.ic,t:d.t(n),n:n,v:Math.min(n,v),r:d.r,done:v>=n}});
}
function openChest(){
  const g=G(),t=todayK();if(g.chest[t]!=='ready')return null;
  const c=30+Math.floor(Math.random()*41);g.bonus+=c;g.chest[t]='opened';
  let item=null;
  if(Math.random()<.3){
    const lv=levelInfo().lv,pool=SHOP.filter(x=>x.k!=='item'&&!g.owned[x.id]&&x.lvl<=lv&&x.price<=300);
    if(pool.length){item=pool[Math.floor(Math.random()*pool.length)];g.owned[item.id]=1}
  }
  markDirty('core');return {coins:c,item:item};
}

const _rm=()=>!!((window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||(document.body&&document.body.classList.contains('calm')));
const pick=a=>a[Math.floor(Math.random()*a.length)];
let petN=0,petT=0,hugTimer=null,hugged=false,greeted=false,ptrAt=0,bubbleEl=null,bubbleT=null,moodT=null;

function autoMood(){
  const h=new Date().getHours(),t=todayK(),pts=ptsOf(t),goal=S.core.set.daily;
  if(h>=23||h<6)return 'sleepy';
  if(pts>=goal)return 'cheer';
  if(h>=18&&pts===0&&dayStreak()>=3)return 'worried';

function liveEls(){
  return Array.prototype.slice.call(document.querySelectorAll('.mascot.live')).filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.bottom>0&&r.top<(window.innerHeight||800)});
}
function mainLive(){
  const l=liveEls();if(!l.length)return null;
  return l.sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width)[0];
}
function mDo(act){
  if(_rm())return;
  liveEls().forEach(svg=>{
    const g=svg.querySelector('.m-root');if(!g)return;
    g.setAttribute('class','m-root');
    requestAnimationFrame(()=>{g.setAttribute('class','m-root r-'+act);setTimeout(()=>{if(g.isConnected)g.setAttribute('class','m-root')},act==='dance'?3800:act==='wave'?1900:1100)});
  });

function mMood(mood,ms){
  clearTimeout(moodT);
  liveEls().forEach(svg=>{
    const sz=+svg.dataset.sz,cls=svg.dataset.cls||'',base=svg.dataset.base||svg.dataset.mood;
    const tpl=document.createElement('div');tpl.innerHTML=mascot(sz,mood,cls,base,svg.dataset.fm);
    if(tpl.firstChild)svg.replaceWith(tpl.firstChild);
  });

    document.querySelectorAll('.mascot.live').forEach(svg=>{
      const base=svg.dataset.base;if(!base||base===svg.dataset.mood)return;
      const tpl=document.createElement('div');tpl.innerHTML=mascot(+svg.dataset.sz,base,svg.dataset.cls||'',base,svg.dataset.fm);
      if(tpl.firstChild)svg.replaceWith(tpl.firstChild);

function mSay(text,ms){
  const svg=mainLive();if(!svg)return;

  b.className='mbubble';b.setAttribute('role','status');b.textContent=text;

  b.style.left=x+'px';b.style.top=Math.max(70,r.top-6)+'px';

function mFx(kind){

    const p=document.createElement('span');p.className='pf';p.setAttribute('aria-hidden','true');p.textContent=pick(E);
    p.style.left=(cx+(Math.random()*r.width*.7-r.width*.35))+'px';p.style.top=cy+'px';
    p.style.setProperty('--dx',((Math.random()-.5)*90)+'px');p.style.setProperty('--dy',(-50-Math.random()*70)+'px');

function tapLine(){

let _trk=false;
function track(x,y){
  if(_trk)return;_trk=true;
  requestAnimationFrame(()=>{
    _trk=false;const svg=mainLive();if(!svg)return;
    const r=svg.getBoundingClientRect(),dx=(x-(r.left+r.width/2))/180,dy=(y-(r.top+r.height/2))/180,c=v=>Math.max(-1,Math.min(1,v));
    const st=document.documentElement.style;st.setProperty('--px',c(dx).toFixed(2));st.setProperty('--py',c(dy).toFixed(2));
  });
}
document.addEventListener('pointermove',e=>{ptrAt=Date.now();track(e.clientX,e.clientY)},{passive:true});

/* ================= Couche de mouvement ================= */
let _enter=false,_enterAt=0,_mk='',_wmap={},_cmap={},_lastAdd=null,lastPt={x:0,y:0},_hudC=null,_hudK='',_io=null;
const haptic=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
function observeRv(el){
  if(!('IntersectionObserver' in window)){el.classList.add('in');return}
  if(!_io)_io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');_io.unobserve(e.target)}}),{threshold:.06});
  _io.observe(el);
  setTimeout(()=>{if(el.isConnected)el.classList.add('in')},5000);
}
function animNum(el,from,to,dur){
  if(_rm()||from===to){el.textContent=to;return}
  const t0=performance.now();
  (function tk(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(p<1&&el.isConnected)requestAnimationFrame(tk);else el.textContent=to;
  })(t0);
}
function animateBars(root){
  root.querySelectorAll('[data-wk]').forEach(el=>{
    const k=el.dataset.wk,to=+el.dataset.w;let prev=_wmap[k];
    if(_enter)prev=0;else if(prev===undefined)prev=to;
    _wmap[k]=to;
    if(_rm()||prev===to){el.style.width=to+'%';return}
    el.style.transition='none';el.style.width=prev+'%';
    void el.offsetWidth;
    el.style.transition='width .95s cubic-bezier(.2,.8,.2,1)';el.style.width=to+'%';
  });
}
function animateCounts(root,enter){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,k=el.dataset.ck;
    let from=(k&&_cmap[k]!==undefined)?_cmap[k]:(enter||el.dataset.from!==undefined?(+el.dataset.from||0):to);
    if(k)_cmap[k]=to;
    animNum(el,from,to,900);
  });
}
function moveInd(){

  const ind=nav.querySelector('.nav-ind'),on=nav.querySelector('button.on');

window.addEventListener('resize',()=>{try{moveInd()}catch(e){}});
function burst(el){
  if(_rm()||!el)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#35E0A1','#FFD54A','#8B7CFF','#FF7AC6'];
  for(let i=0;i<10;i++){
    const d=document.createElement('i');d.className='bst';d.style.left=cx+'px';d.style.top=cy+'px';d.style.background=cols[i%4];
    document.body.appendChild(d);
    const a=i/10*Math.PI*2+Math.random()*.4,dist=26+Math.random()*24;
    if(d.animate){const an=d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+(Math.cos(a)*dist).toFixed(1)+'px),calc(-50% + '+(Math.sin(a)*dist).toFixed(1)+'px)) scale(.2)',opacity:0}],{duration:540,easing:'cubic-bezier(.2,.8,.3,1)'});an.onfinish=()=>d.remove()}else setTimeout(()=>d.remove(),500);
  }
}
function bumpCoin(){const t=document.querySelector('.hud-chip[title="Pièces"]');if(t){t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump')}}
function flyCoins(n){

const num=s=>parseFloat(String(s).replace(/\s/g,'').replace(',','.'));
const fmtNum=n=>{n=Math.round(n*10)/10;return String(n).replace('.',',')};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);

/* ---------- Score Maxx ---------- */
function maxxAt(end){
  if(!DOMAINS.length)return 0;
  const keys=rangeKeys(addDays(end,-6),end),dp=domPts(keys),tg=S.core.set.targets,pr=(S.core.profile&&S.core.profile.prio)||{};
  let sw=0,s=0;
  DOMAINS.forEach((d,i)=>{const w=pr[d.id]===3?3:pr[d.id]===2?2:1,r=Math.min(1,dp[i]/Math.max(1,tg[d.id]||8));s+=w*r;sw+=w});
  const reg=keys.filter(k=>accsOf(k).length).length/7;
  return Math.round(100*(.65*(s/Math.max(1,sw))+.35*reg));
}
const maxxScore=()=>maxxAt(todayK());
function bigRing(p,color,label){
  const R=52,C=2*Math.PI*R;
  return '<svg class="bigring" viewBox="0 0 130 130" role="img" aria-label="'+label+' '+p+' sur 100"><defs><linearGradient id="mxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B4BFF"/><stop offset="1" stop-color="#35E0A1"/></linearGradient></defs><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="rgba(125,130,175,.25)" stroke-width="12"/><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="url(#mxg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*p/100).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" class="br1"><tspan>'+p+'</tspan></text><text x="65" y="92" text-anchor="middle" class="br2">sur 100</text></svg>';
}
function maxxCard(){
  const t=todayK(),s=maxxAt(t),prev=maxxAt(addDays(t,-7)),dl=s-prev,dp=domPts(rangeKeys(addDays(t,-6),t)),tg=S.core.set.targets;
  const rows=DOMAINS.map((d,i)=>({d:d,r:Math.min(1,dp[i]/Math.max(1,tg[d.id]||8))})).sort((a,b)=>b.r-a.r);
  const best=rows[0],worst=rows[rows.length-1];
  return '<section class="card maxx"><div class="mx-top">'+bigRing(s,'',' Score Maxx')+'<div class="mx-b"><h2>Score Maxx</h2><p class="muted small">Équilibre de tes domaines (65 %) et régularité (35 %), sur 7 jours.</p><div class="delta '+(dl>0?'up':dl<0?'down':'flat')+'" style="margin-top:8px">'+(dl>0?'▲ +':dl<0?'▼ ':'= ')+dl+' vs semaine dernière</div></div></div>'
   +(best&&worst&&DOMAINS.length>1?'<div class="mx-rows"><div>'+best.d.icon+' <b>Point fort</b> : '+esc(best.d.name)+' ('+Math.round(best.r*100)+' %)</div><div>'+worst.d.icon+' <b>Maillon faible</b> : '+esc(worst.d.name)+' ('+Math.round(worst.r*100)+' %)</div></div>':'')+'</section>';
}

function protoDomain(p,it){
  if(DOMAINS.some(d=>d.id===p.dom))return p.dom;
  return detectDomain(it[0])||fbDomain();
}
const protoHave=p=>p.items.filter(it=>S.core.routines.some(r=>norm(r.t)===norm(it[0]))).length;
function adoptProtocol(id){
  const p=PROTOCOLS.find(x=>x.id===id);if(!p)return 0;
  const rest=(S.core.profile&&S.core.profile.rest)||[];let n=0;
  p.items.forEach(it=>{
    if(S.core.routines.some(r=>norm(r.t)===norm(it[0])))return;
    S.core.routines.push({id:gid(),t:it[0],d:protoDomain(p,it),p:it[1],days:suggDays(it[2],rest),created:todayK(),on:true,proto:p.id});n++;
  });
  if(n)markDirty('core');return n;
}
function weakProtocol(){
  const t=todayK(),dp=domPts(rangeKeys(addDays(t,-6),t)),tg=S.core.set.targets;let wi=-1,wr=Infinity;
  DOMAINS.forEach((d,i)=>{const r=dp[i]/Math.max(1,tg[d.id]||8);if(r<wr){wr=r;wi=i}});
  if(wi<0)return null;
  const d=DOMAINS[wi],c=protosFor().filter(p=>p.dom===d.id&&protoHave(p)<p.items.length);
  return c.length?{d:d,p:c[0],pct:Math.round(100*wr)}:null;
}
function weakCard(isT){

const chRef=(c,k,i)=>'ch:'+c.id+':'+k+':'+i;
const chDone=(c,k,i)=>accsOf(k).some(a=>a.r===chRef(c,k,i));
const chFull=(c,k)=>c.items.every((x,i)=>chDone(c,k,i));
function chStats(c){
  const t=todayK();let full=0,streak=0;
  for(let k=c.start;k<=t;k=addDays(k,1)){if(chFull(c,k))full++}
  let k=chFull(c,t)?t:addDays(t,-1);
  while(k>=c.start&&chFull(c,k)){streak++;k=addDays(k,-1)}
  return {full:full,streak:streak,day:daysBetween(c.start,t)+1};
}
function startChallenge(key){
  const d=CHALLENGES.find(x=>x.key===key);if(!d)return;
  if(S.core.challenges.some(c=>c.key===key&&!c.done))return;
  const dm=DOMAINS.some(x=>x.id===d.dom)?d.dom:fbDomain();
  S.core.challenges.push({id:gid(),key:key,name:d.n,icon:d.icon,days:d.days,hard:d.hard,items:d.items.slice(),dom:dm,start:todayK(),fails:0,done:false});
  markDirty('core');
}
function toggleChallengeItem(cid,i){
  const c=S.core.challenges.find(x=>x.id===cid);if(!c||c.done)return;
  const k=todayK(),ref=chRef(c,k,i),b=snap();
  if(chDone(c,k,i)){removeRef(k,ref)}
  else{
    const a=addAcc(k,{t:c.items[i]+' ('+c.name+')',d:c.dom,p:1,s:'challenge',r:ref});
    if(chFull(c,k)){toast('Jour '+(daysBetween(c.start,k)+1)+' validé : '+c.name,'trophy');floatFx('Jour validé','xp');sfx('quest')}
  }
  markDirty('core');justDone='c'+cid+i;render();

}

function parseMetric(text){
  const s=norm(text);let m;
  m=s.match(/\b(?:pese|poids)\b[^\d]{0,12}(\d{2,3}(?:[.,]\d+)?)\s*kg/)||s.match(/\bpese\b[^\d]{0,12}(\d{2,3}(?:[.,]\d+)?)/);
  if(m){const v=num(m[1]);if(v>=25&&v<=300)return {key:'weight',v:v}}
  m=s.match(/(\d[\d\s]{2,7})\s*pas\b/);
  if(m){const v=num(m[1]);if(v>=500&&v<=80000)return {key:'steps',v:v}}
  m=s.match(/\bbu\b[^\d]{0,8}(\d+(?:[.,]\d+)?)\s*(?:l|litres?)\b/)||s.match(/(\d+(?:[.,]\d+)?)\s*(?:l|litres?)\s*d'?eau/);
  if(m){const v=num(m[1]);if(v>0&&v<=10)return {key:'water',v:v}}
  m=s.match(/ecran[^\d]{0,12}(\d+(?:[.,]\d+)?)\s*h/)||s.match(/(\d+(?:[.,]\d+)?)\s*h\s*d'?ecran/);
  if(m){const v=num(m[1]);if(v>=0&&v<=20)return {key:'screen',v:v}}
  m=s.match(/\b(?:elo|classement)\b[^\d]{0,10}(\d{3,4})\b/);
  if(m)return {key:'elo',v:num(m[1])};
  m=s.match(/(\d{1,2})\s*cigarettes?\b/);
  if(m&&!/arret|stop|sans|zero|aucune/.test(s))return {key:'cigs',v:num(m[1])};
  m=s.match(/(\d{1,2})\s*verres?\b/);
  if(m&&/(bu|alcool|vin|biere|cocktail)/.test(s))return {key:'drinks',v:num(m[1])};
  m=s.match(/tour de taille[^\d]{0,8}(\d{2,3}(?:[.,]\d+)?)/);
  if(m)return {key:'waist',v:num(m[1])};
  m=s.match(/epargne[^\d]{0,14}(\d[\d\s]*(?:[.,]\d+)?)\s*(?:€|euros?)/);
  if(m)return {key:'savings',v:num(m[1])};
  return null;
}
function ensureMetric(key){
  let m=S.core.metrics.find(x=>x.key===key);if(m)return m;
  const p=METRIC_PRESETS.find(x=>x.key===key);if(!p)return null;
  m={id:gid(),key:key,n:p.n,icon:p.icon,unit:p.unit,dir:p.dir,target:p.target||null,color:p.color,dom:p.dom,log:{}};
  S.core.metrics.push(m);return m;
}
function metricStats(m){
  const ks=Object.keys(m.log).sort();
  if(!ks.length)return {last:null,delta:null,n:0};
  const lastK=ks[ks.length-1],last=m.log[lastK],ref=addDays(lastK,-7);let pk=null;
  ks.forEach(k=>{if(k<=ref)pk=k});
  const delta=pk?last-m.log[pk]:(ks.length>1?last-m.log[ks[0]]:null);
  return {last:last,lastK:lastK,delta:delta,n:ks.length};
}

function sparkSVG(vals,color){
  if(vals.length<2)return '<div class="spark empty-s">Ajoute une 2e mesure pour voir la courbe</div>';
  const W=140,H=42,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[(i*(W-8)/(vals.length-1))+4,H-6-(v-mn)*(H-12)/rg]);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/><circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="3.5" fill="'+color+'"/></svg>';
}
function metricCard(m){
  const st=metricStats(m),ks=Object.keys(m.log).sort().slice(-30),vals=ks.map(k=>m.log[k]);
  const good=st.delta==null||st.delta===0?'flat':(m.dir==='up'?st.delta>0:m.dir==='down'?st.delta<0:null);
  const dcls=good==='flat'||good===null?'flat':good?'up':'down';
  let pct=null;if(m.target&&st.last!=null){pct=m.dir==='down'?Math.min(100,Math.round(100*m.target/Math.max(.01,st.last))):Math.min(100,Math.round(100*st.last/m.target))}
  return '<article class="mcard"><div class="mc-top"><span class="mc-i" style="background:'+hexA(m.color,.16)+'">'+m.icon+'</span><div class="mc-v"><b>'+(st.last==null?'–':fmtNum(st.last))+'</b> <small>'+esc(m.unit)+'</small><div class="mc-n">'+esc(m.n)+'</div></div>'+sparkSVG(vals,m.color)+'</div>'
   +'<div class="row between" style="margin-top:8px"><span class="delta '+dcls+'">'+(st.delta==null?'Pas encore de tendance':(st.delta>0?'▲ +':st.delta<0?'▼ ':'= ')+fmtNum(st.delta)+' '+esc(m.unit)+' sur 7 j')+'</span>'+(m.target?'<span class="small muted">Cible : '+fmtNum(m.target)+' '+esc(m.unit)+'</span>':'')+'</div>'
   +(pct!=null?'<div class="bar" style="margin-top:8px"><i style="width:'+pct+'%;background:'+m.color+'"></i></div>':'')
   +'<div class="gadd"><input type="number" inputmode="decimal" step="any" data-draft="mv-'+m.id+'" data-enter="mlog" data-id="'+m.id+'" placeholder="Valeur du jour ('+esc(m.unit)+')" aria-label="Valeur du jour : '+esc(m.n)+'"><button class="btn ghost" data-a="mlog" data-id="'+m.id+'">Enregistrer</button></div><div class="gact"><button class="btn danger" data-a="mdel" data-id="'+m.id+'">Supprimer</button></div></article>';
}
function metricsHtml(){

/* ================= Sommeil (suivi manuel façon Apple Santé) ================= */
const MOODS=[['😫','Épuisé'],['😕','Fatigué'],['😐','Moyen'],['🙂','Bien'],['😄','En pleine forme']];
const SL_FACTORS=[['cafe','Caféine tardive'],['ecran','Écrans au lit'],['alcool','Alcool'],['repas','Repas tardif'],['sport','Sport tard'],['stress','Stress'],['sieste','Sieste'],['bruit','Bruit ou chaleur']];
const SL_LAT=[[10,'Rapide'],[20,'Normal'],[45,'Long']];
const hm2m=s=>{const m=String(s||'').match(/^(\d{1,2}):(\d{2})$/);return m?(+m[1])*60+(+m[2]):0};
const m2hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const fmtDur=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+pad(r):'')};
const nightDur=(bed,wake)=>(hm2m(wake)-hm2m(bed)+1440)%1440;
const slCfg=()=>S.core.sleep;
const slAsleep=n=>Math.max(0,(n.dur||0)-(n.lat||0));
const slDomain=()=>DOMAINS.some(d=>d.id==='sommeil')?'sommeil':fbDomain();
const slAdj=m=>(m<720?m+1440:m);                        // heures de coucher après minuit regroupées avec la soirée
function slNights(){return Object.keys(S.days).filter(k=>S.days[k]&&S.days[k].sl).sort().map(k=>[k,S.days[k].sl])}
function slLast(n){const t=todayK(),from=addDays(t,-(n-1));return slNights().filter(x=>x[0]>=from)}
function slScore(n){
  const c=slCfg(),as=slAsleep(n),goal=c.goal;
  let d=Math.min(1,as/goal);if(as>goal+90)d=Math.max(.6,1-(as-goal-90)/240);
  const diff=Math.abs(((slAdj(hm2m(n.bed))-slAdj(hm2m(c.bed)))));
  const k=diff<=30?1:Math.max(0,1-(diff-30)/150),q=n.q?n.q/5:.6;
  return Math.round(100*(.55*d+.25*k+.2*q));
}
const slLabel=s=>s>=85?'Excellent':s>=70?'Bon':s>=50?'Moyen':'À améliorer';
function slStats(list){
  if(!list.length)return null;
  const as=list.map(x=>slAsleep(x[1])),beds=list.map(x=>slAdj(hm2m(x[1].bed))),wakes=list.map(x=>hm2m(x[1].wake)),goal=slCfg().goal;
  const mb=mean(beds),sd=Math.sqrt(mean(beds.map(b=>(b-mb)*(b-mb))));
  return {avg:mean(as),bed:m2hm(mb),wake:m2hm(mean(wakes)),reg:Math.max(0,Math.round(100-sd/1.2)),debt:sum(as.map(a=>Math.max(0,goal-a))),ok:as.filter(a=>a>=goal-30).length,n:list.length,sd:sd};
}
function slGoodCount(){return slNights().filter(x=>slScore(x[1])>=70).length}
function slInsights(){
  const L=slNights().slice(-30),out=[],goal=slCfg().goal;
  if(L.length<3)return out;
  // week-end vs semaine
  const we=L.filter(x=>{const d=parse(x[0]).getDay();return d===0||d===6}),wk=L.filter(x=>{const d=parse(x[0]).getDay();return d>=1&&d<=5});
  if(we.length>=2&&wk.length>=3){const diff=mean(we.map(x=>slAdj(hm2m(x[1].bed))))-mean(wk.map(x=>slAdj(hm2m(x[1].bed))));if(diff>=45)out.push(['🎢','Tu te couches en moyenne <b>'+fmtDur(diff)+' plus tard le week-end</b>. Ce décalage fatigue ton rythme : essaie de limiter l\'écart à 1 h.'])}
  SL_FACTORS.forEach(f=>{
    const a=L.filter(x=>(x[1].f||[]).indexOf(f[0])>=0),b=L.filter(x=>(x[1].f||[]).indexOf(f[0])<0);
    if(a.length>=3&&b.length>=3){const d=mean(a.map(x=>slAsleep(x[1])))-mean(b.map(x=>slAsleep(x[1])));if(Math.abs(d)>=20)out.push([d<0?'⚠️':'✅','Les nuits avec « '+f[1].toLowerCase()+' » : <b>'+(d<0?'':'+')+Math.round(d)+' min</b> de sommeil en moyenne ('+a.length+' nuits).'])}
  });
  const wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];L.forEach(x=>{const d=parse(x[0]).getDay();wd[d]+=slAsleep(x[1]);wn[d]++});
  let best=-1,bv=0;wd.forEach((v,i)=>{if(wn[i]>=2&&v/wn[i]>bv){bv=v/wn[i];best=i}});
  if(best>=0)out.push(['⭐','Ta meilleure nuit de la semaine se termine le <b>'+['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][best]+'</b> ('+fmtDur(bv)+' en moyenne).']);
  const s7=slStats(slLast(7));
  if(s7&&s7.n>=3){if(s7.debt>=120)out.push(['💤','Ta dette de sommeil sur 7 jours est de <b>'+fmtDur(s7.debt)+'</b>. Avance ton coucher de 20 minutes pendant 3 soirs.']);else if(s7.ok>=5)out.push(['🏆','<b>'+s7.ok+' nuits sur '+s7.n+'</b> proches de ton objectif : excellent rythme.'])}
  return out;
}

let slForm=null,slMorning=null,slRange=7,nightEl=null,nightTimer=null,nightHidden=false,dialDrag=null;
function slSave(key,n){
  const d=S.days[key]||(S.days[key]={a:[]});d.a=d.a||[];
  n.dur=nightDur(n.bed,n.wake);d.sl=n;

  slCfg().setup=true;markDirty(mk(key));markDirty('core');
}
function actSleep(a){
  const k=viewDate,prev=S.days[k]&&S.days[k].sl?JSON.parse(JSON.stringify(S.days[k].sl)):null,c=slCfg();
  let bed=a.bed,wake=a.wake,est=false;
  if(!bed||!wake){wake=wake||c.wake;const dur=Math.round(a.dur||c.goal);bed=m2hm(hm2m(wake)-dur);est=true}
  const n={bed:bed,wake:wake,lat:0,q:0,f:[],est:est};

  return {icon:'check',text:'Nuit : '+fmtDur(slAsleep(n))+' ('+bed+' → '+wake+')',undo:{k:'sleep',date:k,prev:prev}};
}
function undoSleep(u){
  const d=S.days[u.date];if(!d)return;
  if(u.prev)d.sl=u.prev;else delete d.sl;
  removeRef(u.date,'sl:'+u.date);markDirty(mk(u.date));
}
function parseSleep(text){
  const s=norm(text);
  if(!/(dormi|couche|coucher|reveille|leve|nuit|sommeil)/.test(s))return null;
  const ok=(h,m)=>h>=0&&h<24&&(m==null||m<60),T=(h,m)=>pad(+h)+':'+pad(m?+m:0);
  let m=s.match(/couche[^\d]{0,15}(\d{1,2})\s*(?:h|:)\s*(\d{2})?[^\d]{1,30}(?:leve|reveille)[^\d]{0,15}(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
  if(!m)m=s.match(/(?:de|dormi de|dormi)\s*(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(?:a|au|jusqu'?a|jusqu'?au|->|-)\s*(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
  if(m&&ok(+m[1],m[2])&&ok(+m[3],m[4]))return {bed:T(m[1],m[2]),wake:T(m[3],m[4])};
  m=s.match(/\bdormi\b[^\d]{0,10}(\d{1,2})(?:[.,](\d+))?\s*(?:h|heures?)\s*(\d{2})?/);
  if(m){const v=(+m[1])+(m[2]?+('0.'+m[2]):0)+(m[3]?(+m[3])/60:0);if(v>=1&&v<=16)return {dur:Math.round(v*60)}}
  return null;
}

/* ---------- cadran du programme de sommeil ---------- */
const DC=110,DR=82;
const dAng=m=>(m/1440)*2*Math.PI-Math.PI/2;
const dPt=(m,r)=>[DC+Math.cos(dAng(m))*r,DC+Math.sin(dAng(m))*r];
function dArc(m1,m2,r){const a=dPt(m1,r),b=dPt(m2,r),sw=((m2-m1)%1440+1440)%1440;return 'M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' A'+r+' '+r+' 0 '+(sw>720?1:0)+' 1 '+b[0].toFixed(1)+' '+b[1].toFixed(1)}
function dialSVG(){
  const c=slCfg(),b=hm2m(c.bed),w=hm2m(c.wake),pb=dPt(b,DR),pw=dPt(w,DR);
  let s='<svg id="sleepDial" class="dial" viewBox="0 0 220 220" role="img" aria-label="Programme de sommeil : coucher '+c.bed+', réveil '+c.wake+'"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#FFB46B"/></linearGradient></defs><circle cx="110" cy="110" r="'+DR+'" fill="none" stroke="rgba(125,130,175,.25)" stroke-width="22"/>';
  for(let i=0;i<24;i++){const a=dPt(i*60,DR+17),e=dPt(i*60,DR+(i%6===0?24:20));s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--muted)" stroke-width="'+(i%6===0?2:1)+'" opacity=".6"/>'}
  [[0,'00'],[360,'06'],[720,'12'],[1080,'18']].forEach(x=>{const p=dPt(x[0],DR-24);s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" class="dl">'+x[1]+'</text>'});
  s+='<path id="dArc" d="'+dArc(b,w,DR)+'" fill="none" stroke="url(#dg)" stroke-width="22" stroke-linecap="round"/>';
  s+='<g class="dh" data-h="bed" id="dhBed" transform="translate('+pb[0].toFixed(1)+' '+pb[1].toFixed(1)+')"><circle r="15" fill="#fff" stroke="rgba(0,0,0,.15)"/><text y="6" text-anchor="middle" class="de">🌙</text></g>';
  s+='<g class="dh" data-h="wake" id="dhWake" transform="translate('+pw[0].toFixed(1)+' '+pw[1].toFixed(1)+')"><circle r="15" fill="#fff" stroke="rgba(0,0,0,.15)"/><text y="6" text-anchor="middle" class="de">☀️</text></g>';
  s+='<text x="110" y="104" text-anchor="middle" class="dd" id="dDur">'+fmtDur(c.goal)+'</text><text x="110" y="124" text-anchor="middle" class="ds">objectif</text></svg>';
  return s;
}
function dialRefresh(){
  const c=slCfg(),b=hm2m(c.bed),w=hm2m(c.wake),pb=dPt(b,DR),pw=dPt(w,DR);
  const a=document.getElementById('dArc');if(!a)return;
  a.setAttribute('d',dArc(b,w,DR));
  document.getElementById('dhBed').setAttribute('transform','translate('+pb[0].toFixed(1)+' '+pb[1].toFixed(1)+')');
  document.getElementById('dhWake').setAttribute('transform','translate('+pw[0].toFixed(1)+' '+pw[1].toFixed(1)+')');

function slSetSched(bed,wake){const c=slCfg();if(bed)c.bed=bed;if(wake)c.wake=wake;c.goal=Math.max(60,nightDur(c.bed,c.wake));c.setup=true}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.dh');if(!h)return;
  dialDrag=h.dataset.h;e.preventDefault();
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(!dialDrag)return;const svg=document.getElementById('sleepDial');if(!svg)return;
  const r=svg.getBoundingClientRect();let a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))+Math.PI/2;if(a<0)a+=2*Math.PI;
  const m=(Math.round(a/(2*Math.PI)*1440/5)*5)%1440;

},{passive:true});

}

function sleepHome(isT){
  if(!isT||!quizDone())return '';
  const c=slCfg(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),key=todayK(),has=!!(S.days[key]&&S.days[key].sl),bed=hm2m(c.bed);
  if(c.session){
    return '<section class="card sl-home night"><div class="ch"><h2>🌙 Nuit en cours</h2><span class="pill brand">'+fmtDur(Math.floor((Date.now()-c.session.start)/60000))+'</span></div><div class="row" style="gap:8px"><button class="btn" style="flex:1" data-a="slwake">Je me réveille</button><button class="btn ghost" data-a="slshow">Mode nuit</button></div></section>';
  }
  if(!c.setup&&!DOMAINS.some(d=>d.id==='sommeil'))return '';
  if(nm<13*60&&!has&&c.setup){
    return '<section class="card sl-home"><div class="ch"><h2>☀️ Comment as-tu dormi ?</h2></div><p class="hint" style="margin:0 0 12px">Prévu : '+esc(c.bed)+' → '+esc(c.wake)+' ('+fmtDur(c.goal)+').</p><div class="row" style="gap:8px"><button class="btn sm" style="flex:1" data-a="slplanned">C\'était comme prévu</button><button class="btn ghost sm" style="flex:1" data-a="sladdgo">Saisir ma nuit</button></div></section>';
  }
  const until=((bed-nm)%1440+1440)%1440;
  if(until>0&&until<=(c.wind||60)+30&&nm>=17*60){
    return '<section class="card sl-home"><div class="ch"><h2>🌙 Heure de se détendre</h2><span class="pill">'+fmtDur(until)+' avant le coucher</span></div><ul class="pc-l" style="margin:0 0 12px"><li>Coupe les écrans ou baisse la lumière</li><li>Prépare ta journée de demain</li><li>Skincare, lecture ou respiration</li></ul><button class="btn sm block" data-a="slstart">Je me couche</button></section>';
  }
  if(!c.setup)return '<section class="card sl-home"><div class="ch"><h2>😴 Suis ton sommeil</h2></div><p class="hint" style="margin:0 0 12px">Programme, mode nuit, score et analyses façon Apple Santé.</p><button class="btn sm" data-a="slopen">Configurer mon sommeil</button></section>';
  const last=slNights().slice(-1)[0];
  if(last)return '<section class="card sl-home"><div class="ch"><h2>😴 Dernière nuit</h2><button class="lnk" data-a="slopen">Détails</button></div><div class="row" style="gap:12px"><div class="sl-mini"><b>'+fmtDur(slAsleep(last[1]))+'</b><span>'+esc(fmtShort(last[0]))+'</span></div><div class="sl-mini"><b>'+slScore(last[1])+'</b><span>score</span></div><button class="btn sm" style="margin-left:auto" data-a="slstart">Je me couche</button></div></section>';
  return '';
}
function sleepTick(){
  const c=S.core.sleep;if(!c||!ready||!quizDone())return;
  if(c.session&&!nightEl&&!nightHidden){
    if(Date.now()-c.session.start>18*3600*1000){c.session=null;markDirty('core')}else openNight();
  }
  if(!c.session&&nightEl)closeNight();
}

/* ---------- calculs ---------- */
const capTotal=c=>Math.max(1,daysBetween(c.start,c.end));

  const N=c.n,tot=capTotal(c),names=CAP_NAMES[N]||CAP_NAMES[3];

  if(!p.metric)return null;
  const m=S.core.metrics.find(x=>x.key===p.metric.key),st=m?metricStats(m):null,cur=st&&st.last!=null?st.last:p.metric.start,den=p.metric.target-p.metric.start;
  if(!den||!isFinite(den))return 0;

    return [1,2,3,4].map(k=>'Atteindre '+capFmt(v0+(v1-v0)*k/4)+(u?' '+u:''));

      m=g&&g.ms.filter(m=>!m.done).sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')))[0];

  });

  async clsetpw(){
    if((CL.pw||'').length<8){CL.err='Le mot de passe doit faire au moins 8 caractères.';render();return}
    try{const r=await CL.sb.auth.updateUser({password:CL.pw});if(r.error)throw r.error;CL.pw='';CL.mode='login';CL.err='';CL.msg='Mot de passe mis à jour.'}catch(e){CL.err=cfrErr(e)}
    render();
  },
  clsync(){CL.msg='';cloudSync()},
  async cllogout(){
    CL.msg='';await cloudSync();
    try{await CL.sb.auth.signOut()}catch(e){}
    CL.user=null;CL.msg='Déconnecté. Les données restent sur cet appareil.';setStatus('local');render();
  },
  async cldelete(){
    if(!confirm('Supprimer la copie en ligne de tes données ?\n\nLes données de cet appareil sont conservées, et tu seras déconnecté.'))return;
    try{const r=await CL.sb.from('cap_state').delete().eq('user_id',CL.user.id);if(r&&r.error)throw r.error;const m=cmeta();m.rev=0;m.dirty=chasData();csetmeta(m);await CL.sb.auth.signOut();CL.user=null;CL.msg='Copie en ligne supprimée.';setStatus('local')}catch(e){CL.err=cfrErr(e)}
    render();
  },
  async clwipe(){
    if(!confirm('Effacer toutes les données de cet appareil ?\n\nElles restent dans ton compte, mais tout ce qui n\u2019est pas encore synchronisé sera perdu.'))return;
    await cloudSync();
    if(cmeta().dirty&&!confirm('Certaines modifications n\u2019ont pas pu être envoyées. Effacer quand même ?'))return;
    cwipe();const m=cmeta();m.rev=0;m.dirty=false;csetmeta(m);location.reload();
  },
  clrestore(){
    let c=null;try{c=JSON.parse(localStorage.getItem(CCONF)||'null')}catch(e){}
    if(!c||!c.state||!c.state.core||!c.state.days)return;
    if(!confirm('Remplacer les données actuelles par la version de secours ?'))return;
    cbackup(c.where==='compte'?'appareil':'compte',S);
    localStorage.setItem(LS,JSON.stringify(c.state));loadLocal();
    const m=cmeta();m.dirty=true;m.changedAt=Date.now();csetmeta(m);CL.seq++;
    if(typeof ageSync==='function')ageSync();render();cloudSync();
  }
});
/* ---- démarrage ---- */
async function cloudInit(){
  if(!STANDALONE||!window.supabase||!window.supabase.createClient)return;
  try{
    CL.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    CL.sb.auth.onAuthStateChange((ev,session)=>{
      CL.user=session?session.user:null;
      if(ev==='PASSWORD_RECOVERY'){CL.mode='recovery';CL.msg='';view='profile'}
      setTimeout(()=>{if(CL.user&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))cloudSync();else render()},0);
    });
  }catch(e){CL.sb=null}
  render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CL.user)cloudSync()});
window.addEventListener('online',()=>{if(CL.user)cloudSync()});
setInterval(()=>{if(CL.user&&!document.hidden&&!CL.running)cloudSync()},120000);
cloudInit();

/* ---- connexion depuis l'écran de bienvenue (appareil neuf, sans profil) ---- */
window.__clUi=function(){
  if(!(STANDALONE&&CL.sb))return '';
  if(CL.user)return '<div class="fine" style="margin-top:8px">Connecté : '+cesc(CL.user.email||'')+'</div><button class="lnk center" data-a="cllogout">Se déconnecter</button>';
  return '<button class="lnk center" data-a="clwelcome">J\u2019ai déjà un compte : me connecter</button>';
};
function clPaint(){
  let ov=document.getElementById('clov');
  if(!CL.overlay){if(ov)ov.remove();return}
  const a=document.activeElement,fid=a&&/^cl-/.test(a.id||'')?a.id:null,pos=fid?[a.selectionStart,a.selectionEnd]:null;
  if(!ov){ov=document.createElement('div');ov.id='clov';ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(10,13,43,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow:auto';document.body.appendChild(ov)}
  ov.innerHTML='<div style="width:100%;max-width:520px;max-height:92vh;overflow:auto">'+cloudCard()+'<button class="btn ghost" data-a="clclose" style="width:100%;margin-top:4px">Fermer</button></div>';
  if(fid){const n=document.getElementById(fid);if(n){n.focus();try{n.setSelectionRange(pos[0],pos[1])}catch(e){}}}
}
const _render=render;
render=function(){_render.apply(this,arguments);if(CL.overlay)clPaint()};
Object.assign(actions,{
  clwelcome(){CL.overlay=true;CL.mode='login';CL.err='';CL.msg='';clPaint()},
  clclose(){CL.overlay=false;clPaint()}
});
</script>
